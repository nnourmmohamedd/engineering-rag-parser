# Production retrieval profile — queries the existing ChromaDB collection
# built by `configs/indexing_production.yaml`. Same model/dimension/metric,
# so the query vector always lands in the same space the passages were
# embedded into. See docs/retrieval/ for the full contract and gate list.

profile: production

embedding:
  model_name: BAAI/bge-base-en-v1.5
  model_revision: null
  trust_remote_code: false
  expected_dimension: 768
  maximum_sequence_length: 512
  normalize_embeddings: true
  batch_size: 32
  device: auto
  document_field: retrieval_text
  document_prefix: ""
  query_prefix: "Represent this sentence for searching relevant passages: "
  offline: false
  log_level: INFO

chroma:
  persistence_path: data/output/databases/chroma
  collection_name: engineering_documents_v1
  distance_metric: cosine
  ingestion_batch_size: 100
  idempotent: true
  allow_rebuild: false
  telemetry: false

search:
  default_top_k: 5
  maximum_top_k: 50
  allowed_metadata_filter_fields:
    - source_filename
    - content_type
    - document_id
    - section_title
    - chunk_run_id
    - source_sha256
  query_max_length_chars: 2000
  timeout_s: 30.0
  log_level: INFO

evaluation:
  dataset_path: data/eval/retrieval_ground_truth.jsonl
  k_values: [1, 3, 5, 10]
  output_root: data/output/retrieval
  unanswerable_similarity_threshold: 0.55

logging:
  log_level: INFO
