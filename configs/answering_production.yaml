# Production answering profile — grounded LLM answer generation on top of the
# existing retrieval system. Retrieval itself is configured separately via
# configs/retrieval_production.yaml (engrag-ask defaults to that path; pass
# --retrieval-profile to use another). See docs/answering/ for the full
# contract and gate list.

profile: production

answering:
  default_retrieval_mode: vector
  prompt_version: "1.0.0"
  allow_single_repair: true

# expected_digest is the real, observed digest of the locally-pulled
# `qwen3:4b`, recorded via `ollama list` / GET /api/tags on 2026-08-26 (see
# docs/answering/OLLAMA_SETUP.md and the completion report). Model-selection
# history on this machine (GPU: 2GB VRAM, insufficient for any of these
# models' weights -- generation is CPU-bound throughout):
#   - qwen3:8b:   passed the real grounding acceptance gate reliably, but
#     measured up to ~332s per query -- impractically slow on this hardware.
#   - qwen3:1.7b: rejected. Reproducibly failed `missing_inline_citation`
#     in 3/3 real acceptance runs, including after the repair prompt was
#     strengthened with an explicit inline-marker example -- a genuine
#     instruction-following capability gap at this model size, not a
#     prompt-clarity or code defect.
#   - qwen3:4b:   see the completion report for this model's real
#     acceptance-gate result and, if adopted, its measured latency.
# strict_digest: true means `engrag-ask validate`/`ask` refuses to run
# against a model whose installed digest does not match.
ollama:
  base_url: http://127.0.0.1:11434
  model: qwen3:4b
  expected_digest: 359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7
  strict_digest: true
  think: false
  temperature: 0.0
  seed: 42
  context_window_tokens: 4096
  # 512, not 384: the Phase 3 real acceptance gate on 2026-08-26 measured a
  # real, reproducible generation failure at max_output_tokens=384 -- the
  # `hybrid`-mode "What is an instrument index?" case hit the 384-token cap
  # mid-string (`Unterminated string`) both on first generation and after
  # the one allowed repair, a hard JSON-truncation failure, not a
  # citation-quality issue. 512 still fits the 4096 num_ctx budget below.
  max_output_tokens: 512
  keep_alive: 10m
  connect_timeout_seconds: 5
  # Measured real generation latency on this machine's CPU-bound inference
  # for qwen3:4b; see docs/answering/OLLAMA_SETUP.md and the completion
  # report for the real measured figures this was set from.
  read_timeout_seconds: 240
  max_retries: 1

# Token budget (measured evidence, see docs/answering/GROUNDED_ANSWERING_ARCHITECTURE.md
# and services/context_builder/config.py): the v1.0.0 system prompt is 672
# tokens under the Qwen3 tokenizer (shared across all Qwen3 dense model
# sizes, including 4b); the question/citation-id wrapper plus
# chat-template role markers add roughly another 50. reserved_system_tokens
# (900) leaves real headroom over that measured ~720-750 total.
#
#   max_context_tokens (2200) + reserved_system_tokens (900)
#     + safety_margin_tokens (400) + ollama.max_output_tokens (512)
#     = 4012 <= ollama.context_window_tokens (4096)   [84 tokens headroom]
context_builder:
  tokenizer:
    backend: qwen3
    model_name: Qwen/Qwen3-4B
    revision: 1cfa9a7208912126459214e8b04321603b3df60c
  max_context_tokens: 2200
  reserved_system_tokens: 900
  safety_margin_tokens: 400
  max_sources: 10
  max_sources_per_document: 8
  max_sources_per_section: 3
  deduplicate_content: true
  neighbor_expansion_enabled: true
  neighbor_window: 1

grounding:
  require_inline_citations: true
  require_supporting_quotes: true
  minimum_citations_for_answer: 1
  fail_on_unknown_citation: true
  fail_on_quote_mismatch: true
  citation_coverage_warn_below: 0.6

evaluation:
  dataset_path: data/eval/answering_ground_truth.jsonl
  output_root: data/output/answering_evaluation

logging:
  log_level: INFO

output_root: data/output/answering
