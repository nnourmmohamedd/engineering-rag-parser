[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engineering-rag-parser"
version = "1.0.0"
description = "Engineering-grade, local-first PDF parsing and validation built on Docling."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mohamed Elsayed" }]
keywords = ["docling", "pdf", "rag", "document-parsing", "engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
]

# Runtime dependencies. Every entry is permissively licensed (MIT / BSD /
# Apache-2.0); see THIRD_PARTY_LICENSES.md. PyMuPDF is deliberately absent:
# it is AGPL-3.0 and unsuitable for the corporate engineering use this targets.
dependencies = [
  "docling>=2.121,<3",
  "docling-core>=2.92,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
  "rich>=13.9",
  "pypdf>=5.1",
  "pdfminer.six>=20240706",
  "pypdfium2>=4.30",
  "Pillow>=10.4",
]

[project.optional-dependencies]
# OCR is opt-in: the default path must not pull heavyweight OCR wheels for a
# digitally generated PDF that does not need them.
# rapidocr-onnxruntime ships its default detection/classification/recognition
# ONNX models inside the wheel, so `scanned` profile runs work fully offline
# after installation. easyocr is an optional alternative Docling also supports;
# it downloads ~100 MB of weights from GitHub Releases on first use, which is
# not guaranteed reachable in every deployment/CI network.
ocr = ["rapidocr-onnxruntime>=1.2"]
ocr-easyocr = ["easyocr>=1.7"]
# Local VLM picture description (ADR-005). Off by default; see the parameter guide.
vlm = ["transformers>=4.45", "accelerate>=1.0"]
# Development tooling. Duplicated (deliberately) into [dependency-groups] below:
# `pip install -e ".[dev]"` works on every supported pip version, while
# `pip install -e . --group dev` (PEP 735, pip >= 25.1) is the modern equivalent.
# Keep the two lists in sync; `test_dependency_group_parity` enforces it.
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "reportlab>=4.2",       # builds the synthetic fixture PDFs (BSD-3-Clause)
  "ipykernel>=6.29",
  "jupyter>=1.1",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "build>=1.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "reportlab>=4.2",       # builds the synthetic fixture PDFs (BSD-3-Clause)
  "ipykernel>=6.29",
  "jupyter>=1.1",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "build>=1.2",
]

[project.scripts]
engrag-parse = "engineering_rag_parser.cli:main"

[project.urls]
Documentation = "https://github.com/example/engineering-rag-parser#readme"
Source = "https://github.com/example/engineering-rag-parser"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_rag_parser"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # bugbear
  "C4",        # comprehensions
  "UP",        # pyupgrade
  "SIM",       # simplify
  "PTH",       # prefer pathlib
  "RET",       # return consistency
  "ARG",       # unused arguments
  "TID",       # tidy imports
  "BLE",       # blind except
]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "B008",    # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use magic values, long fixtures and broad excepts, and a
# relative import of the sibling conftest is the idiomatic way to share markers.
"tests/**" = ["ARG", "BLE", "B011", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["engineering_rag_parser"]

[tool.mypy]
# Deliberately NOT pinned to the minimum supported version: numpy's bundled
# stubs use `type` statements that are a syntax error below 3.12, so pinning to
# 3.10 aborts the whole check. mypy therefore targets the running interpreter
# (3.13 here); 3.10 compatibility is covered by `requires-python` plus CI.
files = ["src"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
# Docling/docling-core ship partial annotations; requiring strict typing across
# that boundary would produce noise rather than safety.
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "pypdfium2.*", "pdfminer.*", "pypdf.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: full-document acceptance run against the real PDF (minutes, needs Docling models)",
  "integration: exercises real Docling conversion on a small synthetic fixture",
]
filterwarnings = [
  "default",
  # docling-core emits this for its own deprecated backend shims during import.
  "ignore::FutureWarning:docling.*",
]

[tool.coverage.run]
source = ["src/engineering_rag_parser"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
