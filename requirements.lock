# Reproducible dependency closure for engineering-rag-parser (A-1).
#
# Decision record (full rationale in PARSER_STAGE_FINAL_REPORT.md):
# uv was evaluated first, per the brief's preference, but is not installed in
# this environment, and installing a new package manager mid-milestone to
# produce a single uv.lock carried more risk (untested resolver behaviour
# against the CPU-only PyTorch wheel index on Windows) than benefit for a
# single-maintainer, CPU-only project. This file uses the universally
# supported alternative instead: the exact, verified dependency closure of
# the reference environment, captured with `pip freeze`. It is a full
# closure (runtime + [vlm] + dev group; [ocr]/easyocr is NOT included here —
# see docs/limitations.md, the scanned profile remains experimental in this
# environment), not a minimal one: installing it reproduces the exact
# environment every quality gate and the final acceptance run in this
# repository were verified against.
#
# Captured on: Python 3.13.9 (CPython), Windows-11-10.0.26200, AMD64
# Captured with: python -m pip freeze --local
#
# Usage:
#   New environment, exact reproduction:
#     py -3.13 -m venv .venv
#     .\.venv\Scripts\Activate.ps1
#     python -m pip install --upgrade pip
#     python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
#     python -m pip install -r requirements.lock
#     python -m pip install -e . --no-deps
#
#   New environment, flexible ranges instead of this lock (also valid; see README):
#     python -m pip install -e ".[dev]"
#
#   Regenerate after intentionally upgrading a dependency:
#     python -m pip install -e ".[dev,ocr,vlm]" --upgrade
#     python -m pip freeze --local | grep -v "^-e " | grep -vi engineering-rag-parser | sort > requirements.lock
#     pytest -m "not slow" && ruff check . && mypy src   # re-verify before committing
#
#   Verifying the current environment matches this lock:
#     python -m pip freeze --local | grep -v "^-e " | grep -vi engineering-rag-parser | sort | diff - requirements.lock
#
